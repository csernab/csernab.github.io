<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Progreso 20 Jul 2021 → 20 Jul 2026</title>
  <meta name="description" content="Fin de residencia COT MS" />
  <style>
    :root {
      --bg-1: #0b1020;
      --bg-2: #121a3a;
      --card: #0f1530cc;
      --border: #28346a;
      --fg: #eef2ff;
      --muted: #a8b3cf;
      --accent-a: #ff6ec7;
      --accent-b: #6be7ff;
      --accent-c: #8aff7a;
      --glow-a: #6be7ff55;
      --glow-b: #ff6ec755;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      color: var(--fg);
      background:
        radial-gradient(1200px 600px at 20% -10%, #183a8a44, transparent 60%),
        radial-gradient(1200px 600px at 80% 110%, #0f614844, transparent 60%),
        linear-gradient(120deg, var(--bg-1), var(--bg-2));
      display: grid;
      place-items: center;
      padding: clamp(16px, 4vw, 28px);
    }

    .card {
      width: min(980px, 100%);
      backdrop-filter: blur(8px);
      background: linear-gradient(180deg, #11183b 0%, #0d1230 100%);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: clamp(18px, 2.4vw, 26px);
      box-shadow:
        0 10px 40px rgba(0,0,0,.35),
        0 0 0 1px rgba(255,255,255,.03) inset;
      position: relative;
      overflow: hidden;
    }

    /* Ambient glow */
    .card::before, .card::after {
      content: "";
      position: absolute;
      width: 360px; height: 360px;
      filter: blur(60px);
      opacity: .45;
      pointer-events: none;
      z-index: 0;
    }
    .card::before { background: var(--glow-a); top: -120px; left: -120px; border-radius: 50%; }
    .card::after  { background: var(--glow-b); bottom: -120px; right: -120px; border-radius: 50%; }

    header {
      position: relative; z-index: 1;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: end;
    }
    h1 {
      margin: 0;
      font-size: clamp(22px, 3.6vw, 34px);
      letter-spacing: .2px;
      line-height: 1.15;
    }
    .sub {
      color: var(--muted);
      font-size: 14px;
      text-align: right;
    }

    /* Progress */
    .progress-wrap {
      position: relative; z-index: 1;
      margin: 18px 0 8px;
      background: #0b122c;
      border: 1px solid #1f2a56;
      border-radius: 16px;
      padding: 7px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
    }
    .bar {
      height: 22px;
      width: 0%;
      border-radius: 12px;
      background: linear-gradient(90deg, var(--accent-a), var(--accent-b));
      background-size: 200% 100%;
      animation: sheen 3s linear infinite;
      transition: width .25s ease;
      position: relative;
      overflow: hidden;
    }
    .bar::after {
      /* subtle highlight */
      content: "";
      position: absolute; inset: 0;
      background: linear-gradient(to bottom, rgba(255,255,255,.18), transparent 60%);
      border-radius: inherit;
      pointer-events: none;
    }
    @keyframes sheen {
      0%   { background-position: 0% 0; }
      50%  { background-position: 100% 0; }
      100% { background-position: 0% 0; }
    }

    .label {
      display: flex; justify-content: space-between;
      gap: 12px; flex-wrap: wrap;
      color: var(--muted);
      font-size: 13px;
      margin-top: 6px;
    }
    .label strong {
      color: var(--fg); font-weight: 600;
    }

    /* Stats */
    .stats {
      position: relative; z-index: 1;
      display: grid;
      grid-template-columns: repeat(5, minmax(0,1fr));
      gap: 12px;
      margin-top: 16px;
    }
    .stat {
      background: #0b122c;
      border: 1px solid #1f2a56;
      border-radius: 14px;
      padding: 12px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.05);
    }
    .k { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
    .v { font-size: clamp(18px, 2.8vw, 22px); font-variant-numeric: tabular-nums; }

    .sr-only { position: absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }

    @media (max-width: 880px) {
      .stats { grid-template-columns: repeat(2, minmax(0,1fr)); }
    }
    @media (max-width: 520px) {
      header { grid-template-columns: 1fr; }
      .sub { text-align: left; }
      .stats { grid-template-columns: 1fr; }
    }

    /* Completion state */
    .done .bar {
      background: linear-gradient(90deg, var(--accent-c), #b4ff9e);
    }
    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: #102b1b; color: #a7f3d0;
      border: 1px solid #1f4e33;
      padding: 6px 10px; border-radius: 999px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main class="card" role="region" aria-labelledby="title">
    <header>
      <h1 id="title">Progreso hacia el 20 de julio de 2026</h1>
      <div class="sub" id="now"></div>
    </header>

    <div class="progress-wrap" aria-labelledby="progress-label">
      <div id="bar" class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-describedby="progress-label"></div>
    </div>
    <div class="label" id="progress-label">
      <div><strong id="pct">0.0000%</strong> completado</div>
      <div id="badge" class="badge" style="display:none">🎉 ¡Completado!</div>
    </div>

    <section class="stats" aria-label="Estadísticas del periodo">
      <div class="stat">
        <div class="k">Inicio</div>
        <div class="v" id="start"></div>
      </div>
      <div class="stat">
        <div class="k">Fin</div>
        <div class="v" id="end"></div>
      </div>
      <div class="stat">
        <div class="k">Transcurrido</div>
        <div class="v" id="elapsed">—</div>
      </div>
      <div class="stat">
        <div class="k">Restante</div>
        <div class="v" id="left">—</div>
      </div>
      <div class="stat">
        <div class="k">Duración total</div>
        <div class="v" id="total">—</div>
      </div>
    </section>
  </main>

  <script>
    // CONFIG: periodo fijo en hora local del dispositivo
    const START = new Date(2021, 6, 20, 0, 0, 0, 0); // 20 julio 2021 (mes 6 = julio)
    const END   = new Date(2026, 6, 20, 0, 0, 0, 0); // 20 julio 2026

    const nfPct = new Intl.NumberFormat('es-ES', { maximumFractionDigits: 4, minimumFractionDigits: 4 });
    const nfInt = new Intl.NumberFormat('es-ES');
    const fmtDate = new Intl.DateTimeFormat('es-ES', { dateStyle: 'long' });

    function clamp(x, min, max) { return Math.min(max, Math.max(min, x)); }

    function fmtDHMS(ms) {
      const sign = ms < 0 ? "-" : "";
      ms = Math.abs(ms);
      const s = Math.floor(ms / 1000);
      const d = Math.floor(s / 86400);
      const h = Math.floor((s % 86400) / 3600);
      const m = Math.floor((s % 3600) / 60);
      const sec = s % 60;
      return `${sign}${nfInt.format(d)} d · ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
    }

    function fmtElapsed(ms) {
      ms = Math.max(0, ms);
      const s = Math.floor(ms / 1000);
      const d = Math.floor(s / 86400);
      const h = Math.floor((s % 86400) / 3600);
      return `${nfInt.format(d)} días y ${nfInt.format(h)} h`;
    }

    function update() {
      const now = new Date();
      const total = Math.max(0, END - START);
      const passed = clamp(now - START, 0, total);
      const pct = clamp((passed / total) * 100, 0, 100);

      // Header
      document.getElementById('now').textContent = now.toLocaleString('es-ES', { timeZoneName: 'short' });

      // Static labels
      document.getElementById('start').textContent = fmtDate.format(START);
      document.getElementById('end').textContent = fmtDate.format(END);
      document.getElementById('total').textContent = `${nfInt.format(Math.round(total / 86400000))} días`;

      // Progress
      const bar = document.getElementById('bar');
      bar.style.width = pct + '%';
      bar.setAttribute('aria-valuenow', pct.toFixed(4));
      document.getElementById('pct').textContent = nfPct.format(pct) + '%';

      // Stats
      const leftMs = END - now;
      document.getElementById('left').textContent = fmtDHMS(leftMs);
      document.getElementById('elapsed').textContent = fmtElapsed(passed);

      // Completion
      const badge = document.getElementById('badge');
      if (pct >= 100) {
        document.querySelector('main').classList.add('done');
        badge.style.display = 'inline-flex';
      } else {
        document.querySelector('main').classList.remove('done');
        badge.style.display = 'none';
      }
    }

    update();
    setInterval(update, 1000);
  </script>
</body>
</html>
